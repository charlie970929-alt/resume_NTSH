<title>Pokémon GO 介紹</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Noto Sans TC", sans-serif;
        background: linear-gradient(135deg, #fff3e0, #e3f2fd);
        color: #333;
    }

    /* Header */
    header {
        background: linear-gradient(135deg, #ef5350, #ffca28);
        color: white;
        text-align: center;
        padding: 55px 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    header h1 {
        margin: 0;
        font-size: 42px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    header p {
        margin-top: 12px;
        font-size: 18px;
    }

    /* Main */
    .container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 20px;
    }

    /* Intro */
    .intro {
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        margin-bottom: 30px;
    }

    .intro h2 {
        color: #ef5350;
        margin-top: 0;
    }

    .intro p {
        line-height: 1.9;
        font-size: 16px;
    }

    /* Cards */
    .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }

    .card {
        background: white;
        padding: 28px;
        border-radius: 18px;
        box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    .card h3 {
        color: #1565c0;
        font-size: 21px;
        margin-top: 0;
    }

    .card p {
        line-height: 1.7;
        color: #555;
    }

    /* Highlight */
    .highlight {
        margin-top: 30px;
        background: linear-gradient(135deg, #fff8e1, #ffffff);
        padding: 30px;
        border-radius: 20px;
        border-left: 6px solid #ffca28;
        box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }

    .highlight h2 {
        color: #f57f17;
        margin-top: 0;
    }

    .highlight ul {
        line-height: 2;
    }

    /* Back Button */
    .back {
        text-align: center;
        margin-top: 40px;
    }

    .back a {
        display: inline-block;
        padding: 13px 28px;
        background-color: #1565c0;
        color: white;
        text-decoration: none;
        border-radius: 30px;
        font-weight: bold;
        transition: background-color 0.3s, transform 0.3s;
    }

    .back a:hover {
        background-color: #0d47a1;
        transform: scale(1.05);
    }

    /* Footer */
    footer {
        text-align: center;
        padding: 25px;
        margin-top: 40px;
        color: #777;
        font-size: 14px;
    }

    /* Mobile */
    @media (max-width: 600px) {
        header h1 {
            font-size: 32px;
        }

        header p {
            font-size: 16px;
        }

        .intro,
        .card,
        .highlight {
            padding: 22px;
        }
    }
</style>
